<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOTTA BOLA Premium — Aloqa</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ---------------- UMUMIY SOZLAMALAR ---------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 15px 90px 15px;
      overflow-x: hidden;
    }

    /* ---------------- ORQA FON VIDEO ---------------- */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -10;
      background: #000;
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -9;
      pointer-events: none;
    }

    /* ---------------- ASOSIY KONTEYNER ---------------- */
    main.card {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------------- PROFIL ---------------- */
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 15px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title-box { margin-bottom: 30px; }

    .main-title {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0,0,0,1);
    }

    /* PREMIUM yozuvi o'zgardi */
    .sub-title {
      font-size: 16px;
      background: transparent; /* Orqa fon yo'q */
      color: #fff; /* Oq rang */
      padding: 0;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 4px; /* Harflar orasi ochildi */
      display: inline-block;
      text-shadow: 0 2px 5px rgba(0,0,0,0.8); /* O'qilishi uchun soya */
      opacity: 0.9;
    }

    /* ---------------- BUTTONLAR (LINKLAR) ---------------- */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 15px;
      border-radius: 18px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn-icon {
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .btn-icon i {
      color: #fff;
      font-size: 24px;
    }

    /* TELEFON ICONKASINI TO'G'IRLASH */
    .fa-phone-alt {
      transform: scaleX(-1); /* Iconni gorizontal aylantirish */
    }

    .btn-text {
      flex-grow: 1;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn:active { transform: scale(0.98); background: rgba(0,0,0,0.9); }
    .btn:hover {
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    /* ---------------- ANIMATSIYALAR ---------------- */
    @keyframes subtleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    .anim-shake { animation: subtleShake 0.4s ease-in-out; }

    /* ---------------- MAP (KARTA) ---------------- */
    .map-container {
      margin-top: 10px;
      border-radius: 18px;
      overflow: hidden;
      height: 220px;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #1a1a1a;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      transition: transform 0.3s;
    }

    .map-container:hover { transform: scale(1.02); border-color: #fff; }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: grayscale(100%) invert(92%) contrast(110%);
    }

    .map-link-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      background: transparent;
    }

    /* ---------------- SHARE (YUBORISH) TUGMASI ---------------- */
    .share-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 60px;
      height: 60px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.6);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.3s;
      border: 2px solid rgba(255,255,255,0.5);
    }

    .share-btn:active { transform: scale(0.9); }
    .share-btn:hover { transform: rotate(15deg) scale(1.1); }

  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="kottabola.377vidio.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <main class="card">
    
    <div class="avatar-wrapper">
      <div class="avatar">
        <img src="https://raw.githubusercontent.com/httsfsdjsshtmmltttibof-rgb/kotttabolaa377/9a9d600670529d8cbf182bf1c04c8e8f46750d60/photo_2025-09-23_13-44-31.jpg" alt="Kotta Bola">
      </div>
    </div>

    <div class="title-box">
      <h1 class="main-title">KOTTA BOLA</h1>
      <span class="sub-title">PREMIUM</span>
    </div>

    <div class="links-container">
      
      <a href="tel:+998993773771" class="btn">
        <div class="btn-icon"><i class="fas fa-phone-alt"></i></div>
        <span class="btn-text">Telefon raqam</span>
      </a>

      <a href="https://t.me/kb377uzb" target="_blank" class="btn">
        <div class="btn-icon"><i class="fab fa-telegram-plane"></i></div>
        <span class="btn-text">Telegram</span>
      </a>

      <a href="https://www.instagram.com/kottabola.377?igsh=cWl6MTZraDFxNDUy" target="_blank" class="btn">
        <div class="btn-icon"><i class="fab fa-instagram"></i></div>
        <span class="btn-text">Toshkent filiali</span>
      </a>

      <a href="https://www.instagram.com/kottabola377.samarqand?igsh=MW9rMnB2dXc0aDh2cA" target="_blank" class="btn">
        <div class="btn-icon"><i class="fab fa-instagram"></i></div>
        <span class="btn-text">Samarqand filiali</span>
      </a>

      <a href="https://www.instagram.com/kottabola377.shahrisabz" target="_blank" class="btn">
        <div class="btn-icon"><i class="fab fa-instagram"></i></div>
        <span class="btn-text">Shahrisabz filiali</span>
      </a>

      <a href="https://www.instagram.com/kottabola377.kids/" target="_blank" class="btn">
        <div class="btn-icon"><i class="fab fa-instagram"></i></div> 
        <span class="btn-text">Bolalar uchun.kids</span>
      </a>

      <div class="map-container">
        <iframe src="https://yandex.ru/map-widget/v1/?org_id=162590288895&z=16" allowfullscreen="true"></iframe>
        <a href="https://yandex.ru/maps/org/162590288895" target="_blank" class="map-link-overlay" aria-label="Xaritani ochish"></a>
      </div>

    </div>
  </main>

  <div class="share-btn" onclick="sharePage()">
    <i class="fas fa-share-alt"></i>
  </div>

  <script>
    const buttons = document.querySelectorAll('.btn');
    
    function triggerShake() {
      buttons.forEach((btn, index) => {
        setTimeout(() => {
          btn.classList.add('anim-shake');
          setTimeout(() => btn.classList.remove('anim-shake'), 400);
        }, index * 150); 
      });
    }

    setInterval(triggerShake, 4000);

    function sharePage() {
      if (navigator.share) {
        navigator.share({
          title: 'KOTTA BOLA Premium',
          url: window.location.href
        }).catch((error) => console.log('Xatolik:', error));
      } else {
        const tempInput = document.createElement("input");
        tempInput.value = window.location.href;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        alert("Havola nusxalandi!");
      }
    }
  </script>

</body>
</html>
